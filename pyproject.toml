[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentharness-verifier"
version = "0.1.0"
description = "Independent, auditable verification for coding-agent claims"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Fabio Scialanga" },
]
keywords = ["ai-agents", "coding-agents", "verification", "testing", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pytest>=8,<9",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
grading = [
  "scipy>=1.11,<2",
]

[project.urls]
Homepage = "https://github.com/fabioscialanga/AgentHarness"
Documentation = "https://github.com/fabioscialanga/AgentHarness#readme"
Issues = "https://github.com/fabioscialanga/AgentHarness/issues"
Source = "https://github.com/fabioscialanga/AgentHarness"

[project.scripts]
agentharness = "agentharness.cli:main"
agentharness-security-bundle = "agentharness.security_bundle:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
