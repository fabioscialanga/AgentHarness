name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-compatibility:
    name: Core on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run version-independent core tests
        run: >-
          python -m pytest -q
          --ignore-glob='tests/test_*benchmark_hidden_evaluator.py'
          --ignore-glob='tests/test_task_expansion_batch*.py'
          --ignore=tests/test_stage2_analysis.py
          --ignore=tests/test_stage2_campaign.py

  full-suite:
    name: Full suite and frozen grading environment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frozen grading Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r benchmarks/grading-env/stage2-analysis-requirements.txt

      - name: Validate frozen offline wheelhouse
        run: |
          python benchmarks/grading-env/wheelhouse_gate.py \
            --wheelhouse benchmarks/grading-env/wheelhouse \
            --constraints benchmarks/grading-env/constraints-py312.txt \
            --manifest benchmarks/grading-env/wheelhouse-manifest.json

      - name: Run full suite
        run: python -m pytest -q

  package-smoke:
    name: Wheel and clean-install smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/agentharness-smoke-venv
          /tmp/agentharness-smoke-venv/bin/python -m pip install --upgrade pip
          /tmp/agentharness-smoke-venv/bin/python -m pip install dist/agentharness_verifier-*.whl

      - name: Verify installed CLI and one-command product path
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/agentharness-smoke-workspace
          printf 'from pathlib import Path\n\ndef test_smoke():\n    Path("generated-in-snapshot.txt").write_text("verified\\n")\n    assert 2 + 2 == 4\n' > /tmp/agentharness-smoke-workspace/test_smoke.py
          cd /tmp/agentharness-smoke-workspace
          mkdir -p .agentharness
          RUN_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /tmp/agentharness-smoke-venv/bin/agentharness --help
          test "$(/tmp/agentharness-smoke-venv/bin/agentharness --version)" = "agentharness 0.2.0"
          /tmp/agentharness-smoke-venv/bin/agentharness check \
            --workspace . \
            --command "python -m pytest -q" \
            --run-id "$RUN_ID" \
            --output-dir ".agentharness/runs/$RUN_ID" \
            --json | tee ".agentharness/result-$RUN_ID.json"
          test -f ".agentharness/runs/$RUN_ID/verify-report.json"
          test -f ".agentharness/runs/$RUN_ID/workspace/generated-in-snapshot.txt"
          test ! -f generated-in-snapshot.txt
