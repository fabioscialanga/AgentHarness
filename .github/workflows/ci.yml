name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-compatibility:
    name: Core on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run core tests
        run: |
          python -m pytest -q \
            tests/test_claim_verify.py \
            tests/test_direct_check.py \
            tests/test_foundation.py \
            tests/test_host_prototype.py \
            tests/test_codex_adapter.py \
            tests/test_level2_reliability.py \
            tests/test_release_check.py \
            tests/test_repair_safety.py \
            tests/test_runtime_features.py \
            tests/test_validation.py

  full-suite:
    name: Full suite and frozen grading environment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up frozen grading Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'numpy>=2.0' 'scipy>=1.14' 'pandas>=2.2' 'statsmodels>=0.14'

      - name: Bind frozen grader to Python 3.12
        shell: bash
        run: |
          if [[ ! -x /usr/bin/python3.12 ]]; then
            sudo ln -s "$(command -v python)" /usr/bin/python3.12
          fi
          /usr/bin/python3.12 --version

      # The frozen Hermes preflight requires a private executable path absent on hosted runners.
      # It is checked separately below; all other Stage 2 tests run here.
      - name: Run full suite except external Hermes preflight
        run: |
          python -m pytest -q \
            --deselect=tests/test_stage2_campaign.py::Stage2CampaignRunnerTests::test_preflight_accepts_frozen_hashes_on_clean_synced_commit

  hermes-preflight:
    name: External Hermes preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Report external prerequisite or run preflight
        shell: bash
        run: |
          if [[ ! -x /home/fabio/.local/bin/stage2codex2 ]]; then
            echo 'NOT RUN: frozen Hermes wrapper /home/fabio/.local/bin/stage2codex2 is unavailable on this runner' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m pip install -e .
          python -m pip install 'numpy>=2.0' 'scipy>=1.14' 'pandas>=2.2' 'statsmodels>=0.14'
          python -m pytest -q tests/test_stage2_campaign.py::Stage2CampaignRunnerTests::test_preflight_accepts_frozen_hashes_on_clean_synced_commit

  package-smoke:
    name: Wheel and clean-install smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/agentharness-smoke-venv
          /tmp/agentharness-smoke-venv/bin/python -m pip install --upgrade pip
          /tmp/agentharness-smoke-venv/bin/python -m pip install dist/agentharness_verifier-*.whl

      - name: Verify installed CLI and one-command product path
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/agentharness-smoke-workspace
          printf 'from pathlib import Path\n\ndef test_smoke():\n    Path("generated-in-snapshot.txt").write_text("verified\\n")\n    assert 2 + 2 == 4\n' > /tmp/agentharness-smoke-workspace/test_smoke.py
          cd /tmp/agentharness-smoke-workspace
          mkdir -p .agentharness
          RUN_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /tmp/agentharness-smoke-venv/bin/agentharness --help
          /tmp/agentharness-smoke-venv/bin/agentharness check \
            --workspace . \
            --command "python -m pytest -q" \
            --run-id "$RUN_ID" \
            --output-dir ".agentharness/runs/$RUN_ID" \
            --json | tee ".agentharness/result-$RUN_ID.json"
          test -f ".agentharness/runs/$RUN_ID/verify-report.json"
          test -f ".agentharness/runs/$RUN_ID/workspace/generated-in-snapshot.txt"
          test ! -f generated-in-snapshot.txt
